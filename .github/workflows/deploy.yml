name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to commit SHAs (tag in the trailing comment); bump both together.

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Browser tests
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  image:
    name: Build and push image
    needs: [check, e2e]
    # Only main is ever published. Skipped until the registry and deploy credentials are
    # configured for this repo.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.REGISTRY_URL != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ vars.REGISTRY_URL }}/limefox0013/dbc-config-lab-web:${{ env.IMAGE_TAG }}

  deploy:
    name: Declare/redeploy on lime-fox-infra
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run deploy
        env:
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          LFI_API_URL: https://lime-fox.net/api
          LFI_KEYCLOAK_URL: https://lime-fox.net/auth
          LFI_KEYCLOAK_REALM: limefox
          LFI_DEPLOY_CLIENT_ID: ${{ secrets.LFI_DEPLOY_CLIENT_ID }}
          LFI_DEPLOY_CLIENT_SECRET: ${{ secrets.LFI_DEPLOY_CLIENT_SECRET }}
