name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to commit SHAs (tag in the trailing comment); bump both together.

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab
          POSTGRES_DB: lab_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lab" --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
        env:
          # The API's database-backed specs run against this real Postgres, concurrent ones included.
          TEST_DATABASE_URL: postgresql://lab:lab@127.0.0.1:5432/lab_test
          TEST_DATABASE_CONCURRENT: '1'
      - run: npm run build

  e2e:
    name: Browser tests
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  container:
    name: Container smoke test
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f apps/web/Dockerfile -t dbc-config-lab-web:ci .
      - name: Serves the site and proxies mainnet RPC, keeping the key out of the page
        run: |
          docker run -d --name web -p 8080:8080 -e HELIUS_API_KEY=ci-placeholder-key dbc-config-lab-web:ci
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          curl -sf -o page.html -D headers.txt http://127.0.0.1:8080/
          grep -qi '^content-security-policy:' headers.txt
          ! grep -q ci-placeholder-key page.html
          docker exec web grep -q 'proxy_pass https://mainnet.helius-rpc.com/?api-key=ci-placeholder-key;' /etc/nginx/conf.d/default.conf
          # Another provider is one environment variable, no rebuild (hosting-portability). The
          # host must resolve: nginx looks up its proxy target when it starts.
          docker run -d --name web-other-rpc -e DBC_LAB_MAINNET_RPC_URL=https://example.com/ci dbc-config-lab-web:ci
          for i in $(seq 1 30); do docker exec web-other-rpc test -f /etc/nginx/conf.d/default.conf && break; sleep 1; done
          docker exec web-other-rpc grep -q 'proxy_pass https://example.com/ci;' /etc/nginx/conf.d/default.conf
          # The placeholder key is refused by the provider; any answer from it shows the
          # proxy reached it, where a gateway error or a 404 would not.
          code=$(curl -s -o rpc.txt -w '%{http_code}' -X POST \
            -H 'content-type: application/json' -H 'Origin: http://127.0.0.1:8080' \
            -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' http://127.0.0.1:8080/rpc/mainnet)
          echo "proxy answered $code: $(head -c 200 rpc.txt)"
          case "$code" in 404|500|502|503|504) exit 1 ;; esac
      - name: Publishes the launchpad report feed, fetchable from any origin
        run: |
          curl -sf -o feed.json -D feed-headers.txt -H 'Origin: https://terminal.example' \
            http://127.0.0.1:8080/data/launchpads/index.json
          grep -qi '^access-control-allow-origin: \*' feed-headers.txt
          entry=$(node -e "const f=require('./feed.json'); if (!f.launchpads.length) process.exit(1); console.log(f.launchpads[0].entry)")
          curl -sf -o /dev/null "http://127.0.0.1:8080$entry"
          # A missing feed file is a 404, never the SPA's index.html.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/data/launchpads/missing.json)" = 404
      - if: failure()
        run: docker logs web

  api-container:
    name: API container smoke test
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab
          POSTGRES_DB: lab
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lab" --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f apps/api/Dockerfile -t dbc-config-lab-api:ci .
      - name: Starts on its own database and serves the agent tools over MCP
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql://lab:lab@127.0.0.1:5432/lab \
            -e CALLER_HASH_KEY=ci-hash-key dbc-config-lab-api:ci
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8080/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/health
          accept='Accept: application/json, text/event-stream'
          curl -sf -D init-headers.txt -o init.txt -H 'content-type: application/json' -H "$accept" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            http://127.0.0.1:8080/mcp
          session=$(grep -i '^mcp-session-id:' init-headers.txt | cut -d' ' -f2 | tr -d '\r')
          test -n "$session"
          curl -sf -o /dev/null -H 'content-type: application/json' -H "$accept" -H "mcp-session-id: $session" \
            -d '{"jsonrpc":"2.0","method":"notifications/initialized"}' http://127.0.0.1:8080/mcp
          curl -sf -o tools.txt -H 'content-type: application/json' -H "$accept" -H "mcp-session-id: $session" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' http://127.0.0.1:8080/mcp
          grep -q 'preview_deploy_config' tools.txt
          # A request without a session that is not an initialize is refused, not served.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -H "$accept" \
            -d '{"jsonrpc":"2.0","id":3,"method":"tools/list"}' http://127.0.0.1:8080/mcp)" = 400
      - if: failure()
        run: docker logs api

  image:
    name: Build and push images
    needs: [check, e2e, container, api-container]
    # Only main is ever published. Skipped until the registry and deploy credentials are
    # configured for this repo.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.REGISTRY_URL != ''
    runs-on: ubuntu-latest
    environment: production
    # Pushing to the owner's ghcr.io namespace uses the run's own token: no stored registry credential.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # Optional: the hosted API's address, when it is not the lab's own default.
          build-args: |
            ${{ vars.DBC_LAB_API_URL != '' && format('DBC_LAB_API_URL={0}', vars.DBC_LAB_API_URL) || '' }}
          tags: ${{ vars.REGISTRY_URL }}/limefox0013/dbc-config-lab-web:${{ env.IMAGE_TAG }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ vars.REGISTRY_URL }}/limefox0013/dbc-config-lab-api:${{ env.IMAGE_TAG }}

  deploy:
    name: Declare/redeploy on lime-fox-infra
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run deploy
        env:
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          LFI_API_URL: https://lime-fox.net/api
          LFI_KEYCLOAK_URL: https://lime-fox.net/auth
          LFI_KEYCLOAK_REALM: limefox
          LFI_DEPLOY_CLIENT_ID: ${{ secrets.LFI_DEPLOY_CLIENT_ID }}
          LFI_DEPLOY_CLIENT_SECRET: ${{ secrets.LFI_DEPLOY_CLIENT_SECRET }}
          # The RPC provider key: the site's mainnet proxy and the API's chain reads.
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          # Keys the API's stored caller hashes (any long random string; keep it stable).
          CALLER_HASH_KEY: ${{ secrets.CALLER_HASH_KEY }}
          # Paid plans (optional): USDC receiving wallet and network (mainnet-beta or devnet).
          DBC_LAB_PAY_RECIPIENT: ${{ vars.DBC_LAB_PAY_RECIPIENT }}
          DBC_LAB_PAY_NETWORK: ${{ vars.DBC_LAB_PAY_NETWORK }}
