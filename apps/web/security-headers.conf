# Included in every location: nginx drops inherited add_header lines in any block
# that sets its own, so the policy lives here once.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.devnet.solana.com wss://api.devnet.solana.com https://api.mainnet-beta.solana.com wss://api.mainnet-beta.solana.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=(), clipboard-read=()" always;
# Wallet extensions may open their own popups, so popups keep their opener.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
