# Static SPA server, plus a mainnet RPC proxy. The page connects wallets and signs
# transactions, so script injection and framing are the realistic attacks: scripts only
# from this origin, network access only to this origin and the public devnet RPC.
#
# This file is an envsubst template (/etc/nginx/templates): ${HELIUS_API_KEY} is filled
# in from the container's environment at start, so the key never reaches the page.

# Websocket upgrades pass through the proxy for transaction confirmations.
map $http_upgrade $rpc_connection {
  default upgrade;
  '' close;
}

# The proxy spends the provider key's credits: each address gets a steady share.
limit_req_zone $binary_remote_addr zone=mainnet_rpc:10m rate=20r/s;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # The public mainnet endpoint refuses browser requests, so pages call this instead.
  location = /rpc/mainnet {
    limit_req zone=mainnet_rpc burst=80 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_pass https://mainnet.helius-rpc.com/?api-key=${HELIUS_API_KEY};
    proxy_ssl_server_name on;
    proxy_set_header Host mainnet.helius-rpc.com;
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $rpc_connection;
    proxy_read_timeout 120s;
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # The launchpad report feed: public data any site or terminal may fetch.
  location /data/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
